<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0b0b"><title>JRM Fitness Timer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f7f5ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.brand{font-weight:900;font-size:clamp(30px,5vw,56px)}.brand span{color:#c79a52}.tag{text-align:right;color:#aaa69d;letter-spacing:.14em;text-transform:uppercase}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}button{font:inherit;color:inherit}.preset{background:#151515;border:1px solid #343434;border-radius:18px;padding:18px;text-align:left}.preset.active{border-color:#c79a52}.preset b{display:block;font-size:20px;margin:6px 0}.preset small,.eyebrow,.status{color:#aaa69d}.eyebrow{font-size:12px;letter-spacing:.14em}.timer{background:#151515;border:1px solid #343434;border-radius:24px;padding:clamp(20px,4vw,42px)}.top{display:flex;justify-content:space-between;gap:18px}.phase{font-size:clamp(22px,4vw,42px);font-weight:850}.round{text-align:right;font-size:clamp(16px,2vw,24px);font-weight:700}.exercise{color:#aaa69d;margin-top:5px;font-size:clamp(14px,2vw,20px)}.clock{text-align:center;font-size:clamp(100px,25vw,260px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;margin:32px 0 24px}.track{height:12px;background:#272727;border-radius:999px;overflow:hidden}.bar{height:100%;background:#c79a52}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:24px}.control{min-height:70px;border-radius:16px;border:1px solid #343434;background:#1d1d1d;font-size:20px;font-weight:800}.start{background:#c79a52;color:#111}.status{text-align:center;font-size:14px;margin-top:15px}@media(max-width:700px){.wrap{padding:16px}.presets{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.start{grid-column:1/-1}.tag{display:none}}</style></head>
<body><div class="wrap"><header><div class="brand">JRM <span>FITNESS</span></div><div class="tag">Constant<br>Progression</div></header>
<div class="presets"><button class="preset active" data-key="emom"><span class="eyebrow">SECTION 2</span><b>Mechanics EMOM</b><small>12 × 60 sec · 12:00</small></button><button class="preset" data-key="cardio"><span class="eyebrow">SECTION 3</span><b>Cardio + Movement</b><small>40 work / 20 transition · 15:00</small></button><button class="preset" data-key="core"><span class="eyebrow">SECTION 5</span><b>Core + Lower-Limb</b><small>35 work / 15 transition · 8:20</small></button></div>
<section class="timer"><div class="top"><div><div class="eyebrow" id="label">MECHANICS EMOM</div><div class="phase" id="phase">READY</div></div><div><div class="round" id="round"></div><div class="exercise" id="exercise"></div></div></div><div class="clock" id="clock">1:00</div><div class="track"><div class="bar" id="bar"></div></div><div class="controls"><button class="control start" id="start">START</button><button class="control" id="pause">PAUSE</button><button class="control" id="reset">RESET</button></div><div class="status" id="status">Volume up for interval cues · Keep screen awake during the block</div></section></div>
<script>
const P={emom:{name:"Mechanics EMOM",kind:"emom",rounds:12,work:60,rest:0,ex:["Backward sled drag / backward walk","Supported split squat","Lateral band walk → stick","Wall sit + heel raise"]},cardio:{name:"Cardio + Movement Circuit",kind:"interval",rounds:3,work:40,rest:20,ex:["Low box step-up → knee drive → balance","Med-ball squat → chest throw/catch","Lateral step-over / shuffle","Hip thrust + alternating march","Fast backward walk"]},core:{name:"Core + Lower-Limb Finisher",kind:"interval",rounds:2,work:35,rest:15,ex:["Dead bug + heel tap","Glute bridge march","Incline plank → knee drive","Lying leg circles","Suitcase march"]}};
let key="emom",running=false,timer=null,mode="work",sec=60,item=0,round=0,audio=null;const $=x=>document.getElementById(x),p=()=>P[key],fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
function beep(f=900,d=.12){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.value=.18;o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function next(){let q=p(),i=item+1,r=round;if(i>=q.ex.length){i=0;r++}return r>=q.rounds?"Finish":q.ex[i]}
function render(){let q=p(),m=mode==="rest"?q.rest:q.work;$("label").textContent=q.name.toUpperCase();$("clock").textContent=fmt(sec);$("phase").textContent=running?(mode==="rest"?"TRANSITION":q.kind==="emom"?"WORK / EMOM":"WORK"):"READY";if(q.kind==="emom"){$("round").textContent="Minute "+(round+1)+" / "+q.rounds;$("exercise").textContent=q.ex[round%q.ex.length]}else{$("round").textContent="Round "+(round+1)+" / "+q.rounds+" · Exercise "+(item+1)+" / "+q.ex.length;$("exercise").textContent=mode==="rest"?"Next: "+next():q.ex[item]}$("bar").style.width=Math.max(0,Math.min(100,sec/m*100))+"%";document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("active",b.dataset.key===key))}
function stop(){running=false;clearInterval(timer);timer=null;$("status").textContent="Paused";render()}function finish(){stop();sec=0;$("clock").textContent="0:00";$("phase").textContent="COMPLETE";$("exercise").textContent="Block complete";$("bar").style.width="0%";beep(1200,.3);setTimeout(()=>beep(1450,.35),350)}
function advance(){let q=p();beep(1050,.15);if(q.kind==="emom"){round++;if(round>=q.rounds)return finish();sec=q.work}else if(mode==="work"){mode="rest";sec=q.rest}else{item++;if(item>=q.ex.length){item=0;round++}mode="work";if(round>=q.rounds)return finish();sec=q.work}render()}
function tick(){if(!running)return;sec--;if(sec<=0)advance();else{if(sec<=3)beep(650,.055);render()}}function start(){if(running)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}running=true;$("status").textContent="Timer running";render();timer=setInterval(tick,1000)}function reset(){stop();let q=p();mode="work";sec=q.work;item=0;round=0;$("status").textContent="Ready to start";render()}
document.querySelectorAll(".preset").forEach(b=>b.addEventListener("click",()=>{key=b.dataset.key;reset()}));$("start").onclick=start;$("pause").onclick=stop;$("reset").onclick=reset;render();
</script></body></html>
